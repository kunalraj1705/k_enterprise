name: KRB Enterprise CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: kunalraj1705/krbenterprise

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout application
        uses: actions/checkout@v5
        with:
          path: k_enterprise

      - name: Checkout infrastructure
        uses: actions/checkout@v5
        with:
          repository: kunalraj1705/k_enterprise_infra
          path: k_enterprise_infra

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven

      - name: Build and test
        working-directory: k_enterprise
        run: ./mvnw clean verify

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: k_enterprise
          file: k_enterprise_infra/docker/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy-to-uat:
    name: Deploy to UAT
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, uat]
    environment: UAT

    steps:
      - name: Checkout infrastructure
        uses: actions/checkout@v5
        with:
          repository: kunalraj1705/k_enterprise_infra
          path: k_enterprise_infra

      - name: Deploy application to Kubernetes
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"

          echo "Deploying image:"
          echo "$IMAGE"

          CURRENT_REPLICAS=$(kubectl get deployment krb-enterprise \
            -n uat-core \
            -o jsonpath='{.spec.replicas}')

          echo "Current replicas: $CURRENT_REPLICAS"

          kubectl set image deployment/krb-enterprise \
            krb-enterprise="$IMAGE" \
            -n uat-core

          if [ "$CURRENT_REPLICAS" -eq 0 ]; then
            echo "Application is currently scaled to 0."
            echo "Starting application with 2 replicas..."

            kubectl scale deployment/krb-enterprise \
              --replicas=2 \
              -n uat-core
          else
            echo "Application already has $CURRENT_REPLICAS replicas."
            echo "Keeping existing replica count."
          fi

          kubectl rollout status deployment/krb-enterprise \
            -n uat-core \
            --timeout=180s

      - name: Verify Kubernetes deployment
        run: |
          echo "Pods:"
          kubectl get pods -n uat-core -o wide

          echo
          echo "Deployment:"
          kubectl get deployment krb-enterprise -n uat-core

          echo
          echo "Waiting 60 seconds for application and ingress to stabilize..."
          sleep 60
          
          echo
          echo "Waiting for application health..."

          for i in {1..12}; do
            if curl --fail --silent --show-error \
              -H "Host: uat-customer.krbenterprise.com" \
              http://10.0.2.15:31851/krbenterprise/actuator/health; then

              echo
              echo "Application health check passed."
              exit 0
            fi

            echo "Application not healthy yet. Attempt $i/12..."
            sleep 15
          done

          echo "Application failed health check."

          echo
          echo "Pods:"
          kubectl get pods -n uat-core -o wide

          echo
          echo "Deployment:"
          kubectl describe deployment krb-enterprise -n uat-core

          echo
          echo "Pod events:"
          kubectl get events \
            -n uat-core \
            --sort-by='.lastTimestamp' \
            | tail -50

          exit 1
