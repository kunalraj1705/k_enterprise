name: KRB Enterprise CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: kunalraj1705/k_enterprise

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout application
        uses: actions/checkout@v5
        with:
          path: k_enterprise

      - name: Checkout infrastructure
        uses: actions/checkout@v5
        with:
          repository: kunalraj1705/k_enterprise_infra
          path: k_enterprise_infra

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        working-directory: k_enterprise
        run: ./mvnw clean verify

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: k_enterprise
          file: k_enterprise_infra/docker/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy-to-uat:
    name: Deploy to UAT
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, uat]

    environment: UAT

    steps:
      - name: Checkout infrastructure
        uses: actions/checkout@v5
        with:
          repository: kunalraj1705/k_enterprise_infra
          path: k_enterprise_infra

      - name: Deploy application
        run: |
          export IMAGE_TAG=${{ github.sha }}

          COMPOSE_FILE="$GITHUB_WORKSPACE/k_enterprise_infra/compose/compose.yaml"

          echo "Deploying image:"
          echo "ghcr.io/kunalraj1705/k_enterprise:${IMAGE_TAG}"

          docker-compose \
            -f "$COMPOSE_FILE" \
            pull krb-enterprise

          docker-compose \
            -f "$COMPOSE_FILE" \
            up -d krb-enterprise

      - name: Verify deployment
        run: |
          COMPOSE_FILE="$GITHUB_WORKSPACE/k_enterprise_infra/compose/compose.yaml"

          docker-compose \
            -f "$COMPOSE_FILE" \
            ps